<!DOCTYPE html>
<html>
<head>
    <title>AR con LOD (High/Low)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        // REGISTRAMOS UN COMPONENTE PARA CONTROLAR EL LOD EN AR
        AFRAME.registerComponent('lod-control', {
            init: function () {
                // Obtenemos referencias a los dos modelos dentro del marcador
                this.highPoly = this.el.querySelector('.model-high');
                this.lowPoly = this.el.querySelector('.model-low');
                this.camera = document.querySelector('[camera]');
                
                // Variable para no parpadear (debounce)
                this.currentLevel = 'none'; 
            },
            tick: function () {
                if (!this.el.object3D.visible) return; // Si no ve el marcador, no hace nada

                // Calcular distancia entre la cámara (0,0,0) y el marcador
                // En AR.js, el marcador es el que se mueve, la cámara está fija.
                var distance = this.el.object3D.position.length();

                // --- UMBRAL DE DISTANCIA (Ajusta este número) ---
                // Si está a menos de 2 metros, mostramos High. Si no, Low.
                var threshold = 8; 

                if (distance < threshold) {
                    if (this.currentLevel !== 'high') {
                        console.log("Cambiando a HIGH Poly (Cerca)");
                        this.highPoly.setAttribute('visible', 'true');
                        this.lowPoly.setAttribute('visible', 'false');
                        this.currentLevel = 'high';
                    }
                } else {
                    if (this.currentLevel !== 'low') {
                        console.log("Cambiando a LOW Poly (Lejos)");
                        this.highPoly.setAttribute('visible', 'false');
                        this.lowPoly.setAttribute('visible', 'true');
                        this.currentLevel = 'low';
                    }
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="debugUIEnabled: false; detectionMode: mono_and_matrix;">
        
        <a-entity light="type: ambient; color: #BBB"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1" position="-1 1 0"></a-entity>

        <a-marker preset="hiro" lod-control>
            
            <a-entity 
                class="model-high"
                gltf-model="/models/modelo_high.gltf" 
                scale="3 3 3" 
                rotation="300 0 0"
                position="0 0 0"
                visible="false"> </a-entity>

            <a-entity 
                class="model-low"
                gltf-model="/models/modelo_low.glb" 
                scale="3 3 3" 
                rotation="300 0 0"
                position="0 0 0"
                visible="true"> </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
