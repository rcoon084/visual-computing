<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Final - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Interfaz para el botón de cámara */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            color: white;
        }
        button {
            cursor: pointer;
            padding: 8px 12px;
            font-size: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #45a049; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    
    <div id="ui-container">
        <h3>Controles</h3>
        <p>Click para cambiar vista:</p>
        <button id="btn-camera">Cambiar Perspectiva 🎥</button>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
